# Railway deployment — single service.
# Backend serves both the FastAPI API (POST /verify, /health) and the
# pre-built React frontend (mounted at /). One URL, no CORS dance.
#
# Environment variables are set via `railway variables --set KEY=VAL` or
# the Railway dashboard. OPENAI_API_KEY is the only required secret.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand — Railway runs the Dockerfile's CMD, which uses
# `sh -c "..."` so $PORT is shell-expanded properly. Specifying
# startCommand here would bypass that and pass the literal string
# `${PORT:-8000}` to uvicorn.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
