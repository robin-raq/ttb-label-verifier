[project]
name = "ttb-label-verifier"
version = "0.1.0"
description = "AI-powered TTB alcohol-label verification prototype (take-home)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "raqdominique"}]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "openai>=1.55.0",
    "rapidfuzz>=3.10.0",
    "filetype>=1.2.0",
    "python-multipart>=0.0.12",
    "secure>=0.3.0",
    "slowapi>=0.1.9",
    "sse-starlette>=2.1.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# FastAPI uses `Depends()` / `File()` in parameter defaults by design.
[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]
